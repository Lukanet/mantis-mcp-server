name: Publish to npm

# Trusted publishing (OIDC). The job authenticates to npm with a short-lived
# token issued by GitHub for this specific workflow run, so no npm token is
# stored anywhere - not in the repository, not in the runner, not in a secret.
#
# Before the first run, link the repository on npmjs.com:
#   Package -> Settings -> Trusted publishers -> GitHub Actions
#   repository: lukanet/mantis-mcp-server, workflow: publish.yml
#
# Long-lived granular access tokens with "bypass 2FA" lose the ability to
# publish directly around January 2027 (GitHub changelog, 2026-07-08); from
# then on they can only stage a publish for a human to approve with 2FA.
# This workflow is the path that keeps working.

# Started only by the tag scripts/publish.sh pushes - that script is the one way to release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write          # required for OIDC; without it npm cannot verify the run

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which supports trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Check rather than `npm install -g npm@latest`: npm 12 dropped Node 20 and
      # broke the 0.6.0 release that way. Whatever npm the runner brings has to
      # be new enough, and if it is not, say so plainly.
      - name: Check npm supports trusted publishing
        run: |
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is too old, trusted publishing needs 11.5.1+`); process.exit(1); }
            console.log(`npm ${process.argv[1]}`);
          ' "$(npm --version)"

      - run: npm ci

      - name: Build
        run: |
          rm -rf dist
          npm run build
          test -f dist/index.js

      # The tag drives the release, so package.json has to agree with it -
      # otherwise a mistyped tag publishes a version nobody expects.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi
          echo "publishing version $PKG"

      - name: Show what would be published
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
