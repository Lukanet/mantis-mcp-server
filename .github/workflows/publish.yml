name: Publish to npm

# Trusted publishing (OIDC). The job authenticates to npm with a short-lived
# token issued by GitHub for this specific workflow run, so no npm token is
# stored anywhere - not in the repository, not in the runner, not in a secret.
#
# Before the first run, link the repository on npmjs.com:
#   Package -> Settings -> Trusted publishers -> GitHub Actions
#   repository: lukanet/mantis-mcp-server, workflow: publish.yml
#
# Long-lived granular access tokens with "bypass 2FA" lose the ability to
# publish directly around January 2027 (GitHub changelog, 2026-07-08); from
# then on they can only stage a publish for a human to approve with 2FA.
# This workflow is the path that keeps working.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write          # required for OIDC; without it npm cannot verify the run

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # npm 11.5.1 or newer is required for trusted publishing.
      - name: Ensure a recent npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Build
        run: |
          rm -rf dist
          npm run build
          test -f dist/index.js

      # The tag drives the release, so package.json has to agree with it -
      # otherwise a mistyped tag publishes a version nobody expects.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi
          echo "publishing version $PKG"

      - name: Show what would be published
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --access public
